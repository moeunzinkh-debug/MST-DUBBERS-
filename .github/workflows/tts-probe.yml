# Temporary diagnostic (will be removed): checks how the Edge TTS server behaves when the
# app sends many subtitle lines in a row.
name: TTS server probe

on:
  pull_request:
    paths:
      - .github/workflows/tts-probe.yml
      - .github/scripts/tts_probe.py

permissions:
  contents: read

jobs:
  probe:
    name: Edge TTS server probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 .github/scripts/tts_probe.py
