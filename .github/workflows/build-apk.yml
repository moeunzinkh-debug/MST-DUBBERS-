# Builds the MST DUBBERS FREE Android app and attaches the APKs to the workflow run:
#
#   Debug APK   -> MST-DUBBERS-FREE-v<versionName>-debug-<commit>.apk
#   Release APK -> MST-DUBBERS-FREE-v<versionName>-release-<commit>.apk
#
# Download them from the "Artifacts" section at the bottom of the run's summary page.
#
# Release signing (recommended)
# -----------------------------
# Add these repository secrets (Settings > Secrets and variables > Actions) so every
# release APK is signed with the SAME key and installs as an update over the last one:
#   RELEASE_KEYSTORE_BASE64  base64 of your .jks keystore. The key alias must be "upload"
#                            (required by app/build.gradle.kts).
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_PASSWORD     key password (optional, defaults to RELEASE_STORE_PASSWORD)
# Without them the release APK is signed with a temporary key that changes every run.
#
# Debug signing (optional)
# ------------------------
#   DEBUG_KEYSTORE_BASE64    base64 of a debug.keystore (alias "androiddebugkey",
#                            passwords "android"). Without it a new debug key is
#                            generated on every run.
#
# No Gemini API key is baked into these builds: users enter their own key in the
# app's Settings screen.

name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # bash -eo pipefail

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug APK
            variant: debug
            gradle-task: assembleDebug
          - name: Release APK
            variant: release
            gradle-task: assembleRelease
          - name: Unit tests
            variant: test
            gradle-task: testDebugUnitTest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # The repo pins Gradle in gradle-wrapper.properties but has no gradlew script,
      # so install exactly that Gradle version.
      - name: Read Gradle version
        id: gradle-version
        run: |
          version="$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-\(bin\|all\)\.zip$#\1#p' gradle/wrapper/gradle-wrapper.properties)"
          if [ -z "$version" ]; then
            echo "::error file=gradle/wrapper/gradle-wrapper.properties::Could not read the Gradle version from distributionUrl"
            exit 1
          fi
          echo "Gradle version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle ${{ steps.gradle-version.outputs.version }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
          cache-provider: basic

      # Without a .env file the Secrets Gradle Plugin falls back to the placeholder
      # in .env.example ("MY_GEMINI_API_KEY") and bakes it into the APK.
      - name: Create .env (no API key in the APK)
        run: echo "GEMINI_API_KEY=" > .env

      - name: Prepare debug signing key
        if: matrix.variant != 'release'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > debug.keystore
            echo "Using the debug keystore from the DEBUG_KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -noprompt -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new debug keystore for this run."
          fi

      - name: Prepare release signing key
        if: matrix.variant == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            if [ -z "$RELEASE_STORE_PASSWORD" ]; then
              echo "::error::RELEASE_STORE_PASSWORD must be set together with RELEASE_KEYSTORE_BASE64."
              exit 1
            fi
            store_password="$RELEASE_STORE_PASSWORD"
            key_password="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$keystore"
            if ! keytool -list -keystore "$keystore" -storepass "$store_password" -alias upload > /dev/null; then
              echo "::error::Could not open the release keystore. Check RELEASE_STORE_PASSWORD and make sure the key alias is \"upload\" (required by app/build.gradle.kts)."
              exit 1
            fi
            echo "Signing the release APK with the keystore from repository secrets."
          else
            store_password="$(openssl rand -hex 24)"
            key_password="$store_password"
            echo "::add-mask::$store_password"
            keytool -genkeypair -noprompt -keystore "$keystore" \
              -storepass "$store_password" -keypass "$key_password" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MST DUBBERS FREE (temporary CI key)"
            echo "::warning title=Temporary release signing key::RELEASE_KEYSTORE_BASE64 is not set, so this release APK is signed with a throw-away key. Add the RELEASE_* repository secrets to sign every release with the same key."
          fi
          # Read by the "release" signingConfig in app/build.gradle.kts.
          {
            echo "KEYSTORE_PATH=$keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Run gradle ${{ matrix.gradle-task }}
        run: gradle ${{ matrix.gradle-task }} --stacktrace

      - name: Collect and verify APK
        id: apk
        if: matrix.variant != 'test'
        env:
          VARIANT: ${{ matrix.variant }}
          TITLE: ${{ matrix.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/"$VARIANT"/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK in app/build/outputs/apk/$VARIANT, found ${#apks[@]}."
            exit 1
          fi

          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p;T;q' app/build.gradle.kts)"
          name="MST-DUBBERS-FREE${version:+-v$version}-$VARIANT-${COMMIT_SHA::7}.apk"
          mkdir -p dist
          cp "${apks[0]}" "dist/$name"

          # Fail if the APK is not properly signed (i.e. not installable).
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools="$(printf '%s\n' "$sdk"/build-tools/*/ | sort -V | tail -n 1)"
          "${build_tools}apksigner" verify --print-certs "dist/$name" > apksigner.txt
          cat apksigner.txt
          cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p;T;q' apksigner.txt)"

          {
            echo "### $TITLE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$name\` |"
            echo "| Size | $(du -h --apparent-size "dist/$name" | cut -f1) |"
            echo "| APK SHA-256 | \`$(sha256sum "dist/$name" | cut -d' ' -f1)\` |"
            echo "| Signing certificate SHA-256 | \`$cert_sha256\` |"
            echo ""
            echo "Download it from the **Artifacts** section at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: matrix.variant != 'test'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false # download the .apk directly, no zip
          if-no-files-found: error

      - name: Upload unit test report
        if: failure() && matrix.variant == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
